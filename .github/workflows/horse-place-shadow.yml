name: Horse PLACE paper comparison

# Same original ChatGPT horses; creates NO additional ChatGPT conversations.
# PAPER/RESEARCH ONLY: never access accounts, APIs or place orders.
on:
  schedule:
    - cron: '27 11,12,20,21,22,23 * * *'
  push:
    branches: [main]
    paths:
      - 'independent_horse/place_shadow.py'
      - 'tests/test_place_shadow.py'
      - '.github/workflows/horse-place-shadow.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "Smoke: past source check only; run: generate forward paper journal"
        type: choice
        options: [smoke, run]
        default: smoke

permissions:
  contents: write
  issues: write

concurrency:
  group: horse-place-paper-only
  cancel-in-progress: false

jobs:
  place:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test place terms and paper payout calculations
        run: python -m unittest discover -s tests -p 'test_place_shadow.py' -v
      - name: Select safe action
        id: how
        env:
          GITHUB_EVENT: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          if [ "$GITHUB_EVENT" = 'workflow_dispatch' ]; then
            echo "mode=${REQUESTED_MODE:-smoke}" >> "$GITHUB_OUTPUT"
          else
            # Reconcile on schedule or after a code fix; only pre-race locked picks.
            echo 'mode=run' >> "$GITHUB_OUTPUT"
          fi
      - name: Check official results and recalculate paper PLACE comparison
        run: python -m independent_horse.place_shadow '${{ steps.how.outputs.mode }}'
      - name: Save ONLY forward place journal
        if: ${{ steps.how.outputs.mode == 'run' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- strongest-horse-back-paper/place-shadow/
          if git diff --cached --quiet; then
            echo 'No new place outcomes'
            exit 0
          fi
          git commit -m 'Update separate PLACE-only paper comparison'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report failures in GitHub without another ChatGPT chat
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --title 'Horse PLACE paper comparison failed' --body "The place-only shadow processor failed: $RUN_URL. No bets were placed. Check source and retry; never fabricate odds or a placing."
