name: Independent Horse Paper (shadow)

# Runs independently of ChatGPT. Uses no betting account or execution credentials.
# Schedules are UTC. Python enforces Europe/London selection window.
on:
  schedule:
    - cron: '17 8,9,10,11 * * *'
    - cron: '17 20,21,22 * * *'
  push:
    branches: [main]
    paths:
      - 'independent_horse/**'
      - 'tests/test_independent_horse.py'
      - '.github/workflows/independent-shadow-horse.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Smoke test (no picks), morning, or evening'
        type: choice
        options: [smoke, morning, evening]
        default: smoke

permissions:
  contents: write
  issues: write

concurrency:
  group: independent-horse-paper
  cancel-in-progress: false

jobs:
  horse-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test selection, settlement and immutable recording
        run: python -m unittest discover -s tests -p 'test_independent_horse.py' -v
      - name: Determine mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = "push" ]; then
            echo 'mode=smoke' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            echo "mode=${MANUAL_MODE:-smoke}" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = '17 8,9,10,11 * * *' ]; then
            echo 'mode=morning' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=evening' >> "$GITHUB_OUTPUT"
          fi
      - name: Collect cards or settle PAPER results
        run: python -m independent_horse.runner '${{ steps.mode.outputs.mode }}'
      - name: Commit ONLY independent shadow journal
        if: ${{ steps.mode.outputs.mode == 'morning' || steps.mode.outputs.mode == 'evening' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- strongest-horse-back-paper/independent-shadow/
          if git diff --cached --quiet; then
            echo 'No new records; pick already locked or outside pre-race window'
            exit 0
          fi
          git commit -m 'Independent horse paper shadow predictions/results'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Open GitHub issue on ACTUAL workflow failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --title 'Independent horse paper processor failed' --body "The standalone horse paper collector/reconciler failed instead of inventing a NO BET. It retries on the next schedule. Details: $RUN_URL"
